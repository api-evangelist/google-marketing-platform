    source_doc: https://developers.google.com/marketing-platform/devguides/api/admin/v1/quotas
    description: >-
      The Cloud project exceeded one of the four published per-minute quotas
      (requests 1200, requests per user 600, writes 300, writes per user 120).
    remediation: >-
      Wait one minute and retry; quotas are refilled at the start of the next
      60-second interval. Do NOT treat this 403 as a permanent authorization
      failure — this API signals quota exhaustion with 403, not 429, and the
      generated gRPC clients will not retry it for you.
