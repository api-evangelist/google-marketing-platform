- type: Features
  data:
  - name: Organization Management
    description: List and manage Google Marketing Platform organizations with programmatic
      access to organization settings.
  - name: Analytics Account Linking
    description: Create, list, and delete links between Marketing Platform organizations
      and Google Analytics accounts.
  - name: Service Level Configuration
    description: Set and manage Analytics property service levels including standard
      and 360 tier assignments.
  - name: Multi-Organization Access
    description: Access and manage multiple Marketing Platform organizations from
      a single authenticated session.
- type: UseCases
  data:
  - name: Enterprise Analytics Setup
    description: Programmatically link Google Analytics accounts to Marketing Platform
      organizations for enterprise-scale deployments.
  - name: Service Tier Management
    description: Automate the assignment of Analytics 360 service levels to properties
      across large organizations.
  - name: Organization Auditing
    description: List and audit all Marketing Platform organizations and their linked
      Analytics accounts for governance.
- type: Integrations
  data:
  - name: Google Analytics
    description: Direct linking and service level management for Google Analytics
      accounts within Marketing Platform organizations.
  - name: Google Tag Manager
    description: Part of the Google Marketing Platform suite for tag management and
      measurement integration.
  - name: Display and Video 360
    description: Integrated advertising platform within Google Marketing Platform
      for programmatic media buying.
  - name: Search Ads 360
    description: Search campaign management platform integrated with Marketing Platform
      for cross-channel analytics.
