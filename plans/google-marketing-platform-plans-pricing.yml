description: >-
  Google publishes NO plans, tiers, quotas-for-money or price list for the
  Google Marketing Platform Admin API. Calling the API is not separately
  metered or billed — it is an administrative control-plane API over a Google
  Marketing Platform organization, and access is gated by whether you have a
  GMP organization and the right Analytics permissions, not by a purchased API
  plan. The commercial product the API administers (Google Analytics 360 /
  Analytics service levels) is sold through Google sales and Google Cloud
  resellers on annual contracts with no public price list; the "Contact sales"
  path is the only published route. This file REPLACES a 2026-05-04 bulk-sweep
  scaffold that invented Free / Professional / Enterprise tiers with 1,000 and
  100,000 request quotas and TBD prices. None of that was ever published by
  Google. An honest zero is the correct measurement here.
plan_count: 0
plans: []
commercial_model:
  api_billing: none
  api_billing_note: >-
    No per-call charge, no metered API pricing, no API-specific plan. Usage is
    bounded by the published per-project rate quotas in
    rate-limits/google-marketing-platform-rate-limits.yml, which are free
    quotas rather than purchased capacity.
  underlying_product: Google Analytics 360 service level
  underlying_product_pricing: contact-sales
  underlying_product_pricing_url: https://marketingplatform.google.com/about/analytics-360/
  note: >-
    The API's setPropertyServiceLevel method moves an Analytics property
    between ANALYTICS_SERVICE_LEVEL_STANDARD and the paid 360 service level,
    and reportPropertyUsage returns a BillInfo object (baseFee, eventFee,
    priceProtectionCredit, total) — so billing is real and is exposed through
    the API, but the RATE CARD behind those figures is not published. Third-
    party estimates circulate; none are provider-published and none are
    recorded here.
  billing_fields_exposed:
    - schema: BillInfo
      fields: [baseFee, eventFee, priceProtectionCredit, total]
      source: openapi/google-marketing-platform-v1alpha-discovery.json
    - schema: PropertyUsage
      fields: [totalEventCount, billableEventCount, serviceLevel, propertyType]
      source: openapi/google-marketing-platform-v1alpha-discovery.json
