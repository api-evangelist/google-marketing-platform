naftiko: 1.0.0-alpha2
info:
  label: Google Marketing Platform Analytics Administration
  description: Unified workflow for managing Google Marketing Platform organizations and their Analytics account integrations
    including service level configuration. Used by marketing platform administrators and analytics managers.
  tags:
  - Google Marketing Platform
  - Analytics
  - Platform Administration
  - Organization Management
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    GMP_ACCESS_TOKEN: GMP_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: gmp-admin
    baseUri: https://marketingplatformadmin.googleapis.com
    description: Google Marketing Platform Admin API for organization and analytics management.
    authentication:
      type: bearer
      token: '{{GMP_ACCESS_TOKEN}}'
    resources:
    - name: organizations
      path: /v1alpha/organizations
      description: Organization management.
      operations:
      - name: list-organizations
        method: GET
        description: List Marketing Platform organizations.
        inputParameters:
        - name: pageSize
          in: query
          type: integer
          required: false
          description: Page size.
        - name: pageToken
          in: query
          type: string
          required: false
          description: Page token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: analytics-account-links
      path: /v1alpha/{parent}/analyticsAccountLinks
      description: Analytics account link management.
      operations:
      - name: list-analytics-links
        method: GET
        description: List analytics account links.
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
          description: Organization resource name.
        - name: pageSize
          in: query
          type: integer
          required: false
          description: Page size.
        - name: pageToken
          in: query
          type: string
          required: false
          description: Page token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-analytics-link
        method: POST
        description: Create an analytics account link.
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
          description: Organization resource name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            analyticsAccount: '{{tools.analyticsAccount}}'
    - name: analytics-link-details
      path: /v1alpha/{name}
      description: Individual analytics account link.
      operations:
      - name: delete-analytics-link
        method: DELETE
        description: Delete an analytics account link.
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Link resource name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: service-level
      path: /v1alpha/{analyticsAccountLink}:setPropertyServiceLevel
      description: Service level management.
      operations:
      - name: set-property-service-level
        method: POST
        description: Set the service level for an Analytics property.
        inputParameters:
        - name: analyticsAccountLink
          in: path
          type: string
          required: true
          description: Analytics account link resource name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            analyticsProperty: '{{tools.analyticsProperty}}'
            serviceLevel: '{{tools.serviceLevel}}'
  exposes:
  - type: rest
    port: 8080
    namespace: gmp-analytics-admin-api
    description: Unified REST API for Google Marketing Platform analytics administration.
    resources:
    - path: /v1/organizations
      name: organizations
      description: Organization management.
      operations:
      - method: GET
        name: list-organizations
        description: List Marketing Platform organizations.
        call: gmp-admin.list-organizations
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/organizations/{id}/analytics-links
      name: analytics-links
      description: Analytics account link management.
      operations:
      - method: GET
        name: list-analytics-links
        description: List analytics account links.
        call: gmp-admin.list-analytics-links
        with:
          parent: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-analytics-link
        description: Create an analytics account link.
        call: gmp-admin.create-analytics-link
        with:
          parent: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/analytics-links/{id}
      name: analytics-link-details
      description: Individual analytics link management.
      operations:
      - method: DELETE
        name: delete-analytics-link
        description: Delete an analytics account link.
        call: gmp-admin.delete-analytics-link
        with:
          name: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: gmp-analytics-admin-mcp
    transport: http
    description: MCP server for AI-assisted Google Marketing Platform analytics administration.
    tools:
    - name: list-organizations
      description: List Google Marketing Platform organizations.
      hints:
        readOnly: true
        openWorld: true
      call: gmp-admin.list-organizations
      outputParameters:
      - type: object
        mapping: $.
    - name: list-analytics-links
      description: List analytics account links for an organization.
      hints:
        readOnly: true
      call: gmp-admin.list-analytics-links
      with:
        parent: tools.organizationId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-analytics-link
      description: Create an analytics account link.
      hints:
        readOnly: false
      call: gmp-admin.create-analytics-link
      with:
        parent: tools.organizationId
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-analytics-link
      description: Delete an analytics account link.
      hints:
        destructive: true
        idempotent: true
      call: gmp-admin.delete-analytics-link
      with:
        name: tools.linkName
      outputParameters:
      - type: object
        mapping: $.
    - name: set-property-service-level
      description: Set Analytics property service level (Standard or 360).
      hints:
        readOnly: false
        idempotent: true
      call: gmp-admin.set-property-service-level
      with:
        analyticsAccountLink: tools.analyticsAccountLink
      outputParameters:
      - type: object
        mapping: $.
